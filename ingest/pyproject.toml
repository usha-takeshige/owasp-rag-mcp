[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "qdrant-client",
    "sentence-transformers",
    "pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
